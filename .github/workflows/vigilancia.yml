name: Vigía Jetski

# Cada 15 minutos. Se probó con */5 y GitHub sencillamente no lo respetaba:
# el `schedule` es "cuando se pueda", y los cron muy frecuentes se aparcan los
# primeros cuando hay carga. A 15 minutos se cumple mucho mejor, y como el
# programa solo manda 2 avisos por episodio, tampoco se gana nada mirando más.
#
# Esto SOLO sale gratis en un repositorio PÚBLICO: los repos públicos tienen
# minutos de Actions ilimitados, mientras que uno privado gastaría de sobra
# los 2.000 min/mes gratuitos.
#
# A cambio de ser público, los registros de ejecución los puede leer
# cualquiera. Por eso todo lo que imprime el programa pasa por un filtro que
# tapa los tokens (vigia/secretos.py): Green API mete el suyo en la URL y se
# colaría en los mensajes de error.
#
# Aun así, GitHub retrasa los cron cuando va cargado: 15 minutos son "unos
# 15-30" en la práctica. Para reacción de verdad al minuto hace falta un
# proceso encendido (`--bucle`) en una Raspberry Pi o en Fly.io.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Enviar el parte aunque esté todo en verde"
        type: boolean
        default: false

# Que no se solapen dos ejecuciones tocando el mismo estado.
concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Sin dependencias que instalar: el programa es solo librería estándar,
      # así que no hace falta ni cachear pip.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sin esto, un secreto que falte se traduce en una ejecución "correcta"
      # que no manda nada, y te pasas la tarde mirando por qué no llega el
      # WhatsApp. Mejor que reviente y lo diga.
      - name: Comprobar que están los secretos
        env:
          URL: ${{ secrets.GREEN_API_URL }}
          INSTANCIA: ${{ secrets.GREEN_API_INSTANCIA }}
          TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          CHAT: ${{ secrets.GREEN_API_CHAT }}
          AEMET: ${{ secrets.AEMET_KEY }}
        # Nada de `[ ... ] && ...`: GitHub ejecuta con `bash -e` y una prueba
        # que da falso al final de un bucle aborta el paso por sorpresa.
        run: |
          faltan=""
          for nombre in URL INSTANCIA TOKEN CHAT; do
            valor="${!nombre}"
            if [ -z "$valor" ]; then
              faltan="$faltan GREEN_API_$nombre"
            fi
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos:$faltan - anadelos en Settings > Secrets and variables > Actions"
            exit 1
          fi
          case "$URL" in
            *api.greenapi.com*) ;;
            *) echo "::warning::GREEN_API_URL no parece la de tu instancia (deberia ser https://NNNN.api.greenapi.com)" ;;
          esac
          case "$CHAT" in
            *@g.us|*@c.us) ;;
            *) echo "::error::GREEN_API_CHAT debe acabar en @g.us (grupo) o @c.us (personal)"; exit 1 ;;
          esac
          if [ -z "$AEMET" ]; then
            echo "::warning::Sin AEMET_KEY no hay avisos oficiales: perderas las tormentas que los modelos de oleaje no ven"
          fi
          echo "Secretos presentes y con buena pinta."

      # El estado recuerda qué partes se han enviado, cuántos avisos lleva el
      # episodio y la cuota gastada de Stormglass. Sin él se repetirían cosas.
      - name: Recuperar estado
        uses: actions/cache/restore@v4
        with:
          path: estado.json
          key: vigia-estado-${{ github.run_id }}
          restore-keys: vigia-estado-

      - name: Comprobar la mar y avisar
        env:
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GREEN_API_INSTANCIA: ${{ secrets.GREEN_API_INSTANCIA }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_CHAT: ${{ secrets.GREEN_API_CHAT }}
          CALLMEBOT_TELEFONO: ${{ secrets.CALLMEBOT_TELEFONO }}
          CALLMEBOT_KEY: ${{ secrets.CALLMEBOT_KEY }}
          STORMGLASS_KEY: ${{ secrets.STORMGLASS_KEY }}
          AEMET_KEY: ${{ secrets.AEMET_KEY }}
          CONTACTO: ${{ secrets.CONTACTO }}
          AEMET_COSTA: "44"
          ZONA_AEMET: "Ibiza"
          HORAS_PARTE: "8,14,23"
          # Los partes diarios miran 3 dias, pero solo para informar:
          # el nivel del aviso sigue saliendo de las 12 h.
          HORAS_PRONOSTICO: "72"
          SECTOR_MAR_DESDE: "186"
          SECTOR_MAR_HASTA: "336"
          # Como mucho 2 avisos por episodio, separados 15 min.
          ESCALADA_MINUTOS: "15"
          ESCALADA_MAX: "2"
          # Una hora por debajo del umbral antes de dar el "ya paso":
          # si no, un nivel que baila genera aviso-calma-aviso-calma.
          CALMA_MINUTOS: "60"
          # Aquí el cron ya viene cada 15 min, así que el freno interno se
          # deja al mínimo: manda la frecuencia del cron.
          INTERVALO_CALMA: "840"
          INTERVALO_OJO: "840"
          INTERVALO_ALERTA: "300"
          TZ: "Europe/Madrid"
        run: |
          set +e
          python -m vigia ${{ inputs.forzar && '--forzar' || '' }}
          codigo=$?
          # 0 = calma · 1 = hay aviso (normal) · 2 = ninguna fuente respondió
          if [ "$codigo" = "2" ]; then
            echo "::warning::Ninguna fuente respondió: no sabemos cómo está la mar"
          fi
          exit 0

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado.json
          key: vigia-estado-${{ github.run_id }}
